<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<!-- Page de mise en scène de la vidéo tutoriel : l'application dans un cadre de téléphone,
     titres d'étapes, cartes d'ouverture et de fin. Format vertical 1080×1920. -->
<style>
  @font-face { font-family: Fraunces; src: url(Fraunces_600SemiBold.ttf); font-weight: 600; }
  @font-face { font-family: Inter; src: url(Inter_400Regular.ttf); font-weight: 400; }
  @font-face { font-family: Inter; src: url(Inter_600SemiBold.ttf); font-weight: 600; }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #0B2540; }
  body { font-family: Inter, sans-serif; color: #fff; position: relative; }
  #caption { position: absolute; top: 70px; left: 80px; right: 80px; height: 230px; transition: opacity .35s; }
  #chip { display: inline-block; background: #E4D3B4; color: #0B2540; font-weight: 600; font-size: 26px;
          letter-spacing: 2px; padding: 8px 18px; border-radius: 10px; }
  #title { font-family: Fraunces, serif; font-weight: 600; font-size: 66px; line-height: 1.1; margin-top: 18px; }
  #sub { font-size: 32px; color: #B9C7D6; margin-top: 12px; line-height: 1.3; }
  #phone { position: absolute; left: 50%; top: 330px; width: 390px; height: 844px;
           transform: translateX(-50%) scale(1.85); transform-origin: top center;
           border-radius: 26px; overflow: hidden; box-shadow: 0 0 0 5px #123257, 0 0 0 7px #169A97; background: #FAF8F4; }
  #phone iframe { width: 390px; height: 844px; border: 0; display: block; }
  .tap { position: absolute; width: 90px; height: 90px; margin: -45px 0 0 -45px; border-radius: 50%;
         background: rgba(228, 211, 180, .55); border: 4px solid #E4D3B4; pointer-events: none;
         animation: tap .7s ease-out forwards; z-index: 5; }
  @keyframes tap { from { transform: scale(.4); opacity: 1 } to { transform: scale(1.3); opacity: 0 } }
  #card { position: absolute; inset: 0; background: #0B2540; z-index: 10; display: flex; flex-direction: column;
          align-items: center; justify-content: center; text-align: center; padding: 0 90px; transition: opacity .5s; }
  #card.hidden { opacity: 0; pointer-events: none; }
  #card img { width: 360px; }
  #card h1 { font-family: Fraunces, serif; font-weight: 600; font-size: 130px; margin: 10px 0 0; }
  #card .line { width: 110px; height: 6px; background: #E4D3B4; border-radius: 3px; margin: 34px auto; }
  #card p { font-size: 40px; color: #B9C7D6; margin: 0; line-height: 1.35; }
  #card .big { font-family: Fraunces, serif; font-size: 64px; color: #fff; line-height: 1.15; }
  #card .note { font-size: 27px; color: #8FA3B8; margin-top: 70px; line-height: 1.4; }
  #card .demo { display: inline-block; margin-top: 40px; font-size: 26px; font-weight: 600; letter-spacing: 1.5px;
                color: #6E5320; background: #F3EADA; padding: 10px 22px; border-radius: 10px; }
</style>
</head>
<body>
  <div id="caption"><span id="chip"></span><div id="title"></div><div id="sub"></div></div>
  <div id="phone"><iframe id="app" src="/"></iframe></div>
  <div id="card"></div>
<script>
  window.setCaption = (chip, title, sub) => {
    const c = document.getElementById('caption');
    c.style.opacity = 0;
    setTimeout(() => {
      document.getElementById('chip').textContent = chip;
      document.getElementById('chip').style.display = chip ? 'inline-block' : 'none';
      document.getElementById('title').textContent = title;
      document.getElementById('sub').textContent = sub || '';
      c.style.opacity = 1;
    }, 350);
  };
  window.showCard = (html) => { const c = document.getElementById('card'); c.innerHTML = html; c.classList.remove('hidden'); };
  window.hideCard = () => document.getElementById('card').classList.add('hidden');
  // Cercle de « toucher » aux coordonnées de la page.
  window.tapAt = (x, y) => {
    const t = document.createElement('div');
    t.className = 'tap';
    t.style.left = x + 'px';
    t.style.top = y + 'px';
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 800);
  };
</script>
</body>
</html>
